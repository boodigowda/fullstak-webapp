trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------- BUILD STAGE (runs on every PR and every push to main) ----------
- stage: Build
  jobs:
    - job: BuildBackend
      steps:
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.12'
        - script: |
            python -m venv antenv
            source antenv/bin/activate
            pip install -r requirements.txt
          displayName: 'Install backend dependencies'
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: '$(System.DefaultWorkingDirectory)'
            includeRootFolder: false
            archiveFile: '$(Build.ArtifactStagingDirectory)/backend.zip'
            excludePaths: |
              frontend
              antenv
        - publish: '$(Build.ArtifactStagingDirectory)/backend.zip'
          artifact: backend

    - job: BuildFrontend
      steps:
        - task: NodeTool@0
          inputs:
            versionSpec: '20.x'
        - script: |
            cd frontend
            npm ci
            npm run build
          displayName: 'Install & build frontend'
        - task: ArchiveFiles@2
          inputs:
            rootFolderOrFile: 'frontend/build'
            includeRootFolder: true
            archiveFile: '$(Build.ArtifactStagingDirectory)/frontend.zip'
        - publish: '$(Build.ArtifactStagingDirectory)/frontend.zip'
          artifact: frontend

# ---------- DEPLOY STAGE (only runs on main, NOT on PRs) ----------
- stage: Deploy
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - deployment: DeployBackend
      environment: 'production-backend'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: backend
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: 'azure-subscription-connection'
                  appType: webAppLinux
                  appName: 'fullstak-backend-python'
                  package: '$(Pipeline.Workspace)/backend/backend.zip'

    - deployment: DeployFrontend
      environment: 'production-frontend'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: frontend
              - task: AzureWebApp@1
                inputs:
                  azureSubscription: 'azure-subscription-connection'
                  appType: webAppLinux
                  appName: 'fullstak-frontend-react'
                  package: '$(Pipeline.Workspace)/frontend/frontend.zip'